import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import org.apache.tools.ant.filters.ReplaceTokens

plugins {
	id "architectury-plugin" version "3.4-SNAPSHOT"
	id "de.undercouch.download" version "4.1.2"
	id "dev.architectury.loom" version "1.0-SNAPSHOT" apply false
	id "com.github.johnrengelman.shadow" version "7.1.0" apply false
}

def default_minecraft_version = "1.16.5"
def minecraft_version = rootProject.properties.containsKey("buildVersion") ? rootProject.getProperties().get("buildVersion").toString() : default_minecraft_version
def minecraft_main_version = minecraft_version.split("\\.")[1] as int
def patreon_api_key = rootProject.properties.containsKey("patreonApiKey") ? rootProject.getProperties().get("patreonApiKey").toString() : ""
// 1.19.4 keeps using the Parchment data for 1.19.3
def is_1_19_4 = minecraft_version == "1.19.4"
def parchment_version = getXml("https://ldtteam.jfrog.io/artifactory/parchmentmc-internal/org/parchmentmc/data/parchment-${is_1_19_4 ? "1.19.3" : minecraft_version}/maven-metadata.xml").versioning.release
def testServer = rootProject.properties.containsKey("testServer") ? rootProject.getProperties().get("testServer").toString() : ""

// The latest 1.20.1 dependencies need a newer Loom, which would affect every other version
def is_1_20 = minecraft_main_version == 20
rootProject.ext.is_1_20 = is_1_20
rootProject.ext.fabric_loader_version = [minecraft_version, is_1_20 ? "0.14.22" : getJson("https://meta.fabricmc.net/v2/versions/loader/" + minecraft_version)[0]["loader"]["version"]]
rootProject.ext.forge_version = minecraft_version + "-" + getJson("https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json")["promos"][minecraft_version + "-latest"]
rootProject.ext.fabric_api_data = is_1_20 ? ["0.85.0+1.20.1", getModrinthMavenUrl("fabric-api", "0.85.0+1.20.1")] as String[] : getModrinthData("fabric", minecraft_version, "fabric-api")
rootProject.ext.mod_menu_data = is_1_20 ? ["7.1.0", ""] as String[] : getModrinthData("fabric", minecraft_version, "modmenu")
rootProject.ext.architectury_data = is_1_20 ? ["9.2.14", getModrinthMavenUrl("architectury-api", "9.2.14+forge")] as String[] : getModrinthData("forge", minecraft_version, "architectury-api")
rootProject.ext.architectury_fabric_url = is_1_20 ? getModrinthMavenUrl("architectury-api", "9.2.14+fabric") : getModrinthData("fabric", minecraft_version, "architectury-api")[1]

rootProject.ext.minecraft_version_int = minecraft_version.split("\\.")[0] + minecraft_version.split("\\.")[1].padLeft(2, "0") + (minecraft_version.split("\\.").length > 2 ? minecraft_version.split("\\.")[2].padLeft(2, "0") : "00")
rootProject.ext.cloth_config_version = ["1.16.5": "4.17.101", "1.17.1": "5.3.63", "1.18.2": "6.5.102", "1.19.4": "10.1.105", "1.20.1": "11.1.106"][minecraft_version]
rootProject.ext.architectury_id = minecraft_main_version == 16 ? "me.shedaniel" : "dev.architectury"
rootProject.ext.variation = rootProject.properties.containsKey("variation") ? rootProject.getProperties().get("variation").toString() : "normal"
rootProject.ext.variation_header = rootProject.variation == "normal" ? "MTR" : rootProject.variation == "server" ? "MTR-server" : "Modern-Elevators-Escalators"
// ANTE needs the shaders added in 1.17, so 1.16.5 is built without it
rootProject.ext.has_ante = minecraft_main_version >= 17 && rootProject.variation == "normal"
// The server jar is the same build without what only clients use: fonts, sounds, textures, models and the script engine of ANTE
rootProject.ext.server_jar_excludes = [
		"assets/*/font/**", "assets/*/sounds/**", "assets/*/textures/**", "assets/*/models/**", "assets/*/blockstates/**",
		"assets/*/particles/**", "assets/*/scripts/**", "assets/minecraft/atlases/**",
		"org/graalvm/**", "com/oracle/**", "META-INF/versions/*/org/graalvm/**", "META-INF/versions/*/com/oracle/**",
		"META-INF/graalvm/**", "META-INF/native-image/**", "META-INF/upgrade/**",
		"META-INF/services/com.oracle.*", "META-INF/services/org.graalvm.*",
		"cn/zbx1425/mtrsteamloco/mixin/FQ*", "mtrsteamloco.mixins.json"
]

/**
 * Writes the ANTE mixin config for the server jar, without the mixins into the script engine, which that jar leaves out.
 */
rootProject.ext.writeServerMixinConfig = { File source, File target ->
	def config = new groovy.json.JsonSlurper().parse(source)
	config.mixins = config.mixins.findAll { !it.startsWith("FQ") }
	target.parentFile.mkdirs()
	target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
}

architectury {
	minecraft = minecraft_version
}

// The simulation component runs without Minecraft, so it is a plain Java project kept out of everything Minecraft below
def isComponent = { project -> project.name == "transit-sim" }

configure(subprojects.findAll { !isComponent(it) }) {
	apply plugin: "dev.architectury.loom"
	apply plugin: "com.github.johnrengelman.shadow"

	loom {
		silentMojangMappingsLicense()

		mixin {
			defaultRefmapName.set("mtr-refmap.json")
		}
	}

	configurations {
		shadowCommon
	}

	dependencies {
		minecraft "com.mojang:minecraft:${minecraft_version}"
		mappings loom.layered() {
			officialMojangMappings()
			parchment("org.parchmentmc.data:parchment-${is_1_19_4 ? "1.19.3" : minecraft_version}:${parchment_version}@zip")
		}
		implementation name: "Dynmap-3.2.1"
		implementation name: "BlueMapAPI-2.1.1"
		implementation "xyz.jpenilla:squaremap-api:1.3.13"
		implementation "org.eclipse.jetty:jetty-http:9.4.58.v20250814"
		implementation "org.eclipse.jetty:jetty-io:9.4.58.v20250814"
		implementation "org.eclipse.jetty:jetty-security:9.4.58.v20250814"
		implementation "org.eclipse.jetty:jetty-server:9.4.58.v20250814"
		implementation "org.eclipse.jetty:jetty-servlet:9.4.58.v20250814"
		implementation "org.eclipse.jetty:jetty-util:9.4.58.v20250814"
		implementation "org.eclipse.jetty:jetty-util-ajax:9.4.58.v20250814"
		implementation "javax.servlet:javax.servlet-api:4.0.1"
		implementation "org.msgpack:msgpack-core:0.9.12"
		implementation "com.hierynomus:sshj:0.41.2"
		implementation "org.xerial:sqlite-jdbc:3.46.1.3"
		implementation "com.github.jonafanho:Minecraft-Mod-API-Tools:${rootProject.minecraft_mod_api_tools_version}"
		implementation "org.joml:joml:1.10.5"
		if (rootProject.has_ante) {
			annotationProcessor "systems.manifold:manifold-preprocessor:${rootProject.manifold_version}"
			compileOnly "com.github.stuxuhai:jpinyin:1.1.7"
			compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
		}
		// Loom can't read the Java 21 classes in these jars, so they stay off the classpath used for remapping
		if (rootProject.has_ante && name == "common") {
			compileOnly "org.graalvm.polyglot:polyglot:${rootProject.graaljs_version}"
			compileOnly "org.graalvm.polyglot:js:${rootProject.graaljs_version}"
			compileOnly "org.graalvm.truffle:truffle-api:${rootProject.graaljs_version}"
			compileOnly "org.graalvm.truffle:truffle-runtime:${rootProject.graaljs_version}"
		}
		if (rootProject.has_ante && (name == "fabric" || name == "forge")) {
			shadowCommon "org.graalvm.polyglot:polyglot:${rootProject.graaljs_version}"
			shadowCommon "org.graalvm.polyglot:js:${rootProject.graaljs_version}"
			shadowCommon "org.graalvm.truffle:truffle-api:${rootProject.graaljs_version}"
			shadowCommon "org.graalvm.truffle:truffle-runtime:${rootProject.graaljs_version}"
			shadowCommon "com.github.stuxuhai:jpinyin:1.1.7"
		}
		shadowCommon "org.eclipse.jetty:jetty-http:9.4.58.v20250814"
		shadowCommon "org.eclipse.jetty:jetty-io:9.4.58.v20250814"
		shadowCommon "org.eclipse.jetty:jetty-security:9.4.58.v20250814"
		shadowCommon "org.eclipse.jetty:jetty-server:9.4.58.v20250814"
		shadowCommon "org.eclipse.jetty:jetty-servlet:9.4.58.v20250814"
		shadowCommon "org.eclipse.jetty:jetty-util:9.4.58.v20250814"
		shadowCommon "org.eclipse.jetty:jetty-util-ajax:9.4.58.v20250814"
		shadowCommon "javax.servlet:javax.servlet-api:4.0.1"
		shadowCommon "org.msgpack:msgpack-core:0.9.12"
		shadowCommon "org.xerial:sqlite-jdbc:3.46.1.3"
	}
}

task setupFiles() {
	System.out.println("Fabric Loader: " + rootProject.fabric_loader_version[1])
	System.out.println("Forge: " + rootProject.forge_version)
	System.out.println("Fabric API: " + rootProject.fabric_api_data[0])
	System.out.println("Mod Menu: " + rootProject.mod_menu_data[0])
	System.out.println("Architectury: " + rootProject.architectury_data[0].split("\\+")[0])
	System.out.println("Parchment: " + parchment_version)

	download {
		src "https://github.com/jonafanho/Minecraft-Mappings/archive/refs/heads/${is_1_19_4 ? minecraft_version : "1." + minecraft_main_version}.zip"
		dest "common/src/main/java/mtr/mappings/mappings.zip"
		overwrite true
		retries 5
		connectTimeout 10000
		readTimeout 300000
	}
	copy {
		outputs.upToDateWhen { false }
		from(zipTree("common/src/main/java/mtr/mappings/mappings.zip")) { eachFile { file -> file.relativePath = new RelativePath(true, file.relativePath.segments.drop(1) as String[]) } }
		into "common/src/main/java/mtr/mappings"
		filter(ReplaceTokens, tokens: ["package": "mtr.mappings"])
	}
	delete fileTree("common/src/main/java/mtr/compat")
	copy {
		outputs.upToDateWhen { false }
		from "common/src/main/compat/" + (is_1_20 ? "modern" : "legacy")
		into "common/src/main/java/mtr/compat"
	}
	ant.path { ant.fileset(dir: "common/src/main/java/mtr/mappings", includes: "Fabric*.java") }.list().each {
		ant.move(file: it, todir: "fabric/src/main/java/mtr/mappings")
	}
	ant.path { ant.fileset(dir: "common/src/main/java/mtr/mappings", includes: "Forge*.java") }.list().each {
		ant.move(file: it, todir: "forge/src/main/java/mtr/mappings")
	}

	if (is_1_20) {
		copy {
			outputs.upToDateWhen { false }
			from "common/src/main/compat/platform/fabric"
			into "fabric/src/main/java/mtr/mappings"
		}
		copy {
			outputs.upToDateWhen { false }
			from "common/src/main/compat/platform/forge"
			into "forge/src/main/java/mtr/mappings"
		}
	}

	delete fileTree("common/src/main/resources/assets/mtr/sounds")
	delete fileTree("common/src/main/resources/assets/mtr/textures")
	delete fileTree("common/src/main/resources/assets/mtr/website")
	delete fileTree("common/src/main/resources/assets/mtr/sounds.json")
	delete fileTree("common/src/main/resources/data/mtr/loot_tables")
	delete fileTree("common/src/main/resources/data/mtr/recipes")
	delete fileTree("fabric/src/main/resources")
	delete fileTree("forge/src/main/resources")
	copy {
		outputs.upToDateWhen { false }
		from "resources/common/lifts"
		into "common/src/main/resources"
	}
	if (rootProject.variation == "normal") {
		copy {
			outputs.upToDateWhen { false }
			from "resources/common/normal"
			into "common/src/main/resources"
		}
		if (rootProject.has_ante) {
			copy {
				outputs.upToDateWhen { false }
				from "resources/common/ante"
				into "common/src/main/resources"
			}
		} else {
			delete fileTree("common/src/main/resources/assets/mtrsteamloco")
			delete "common/src/main/resources/mtrsteamloco.mixins.json"
			delete "common/src/main/resources/assets/mtr/font/noto-sans-cjk-tc-medium.otf"
		}
	}
	if (rootProject.variation == "normal" || rootProject.variation == "server") {
		download {
			src "https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"
			dest "common/src/main/resources/assets/mtr/website/fabric.min.js"
			overwrite true
			retries 5
			connectTimeout 10000
			readTimeout 300000
		}
		download {
			src "https://raw.githubusercontent.com/bramstein/fontfaceobserver/master/fontfaceobserver.standalone.js"
			dest "common/src/main/resources/assets/mtr/website/fontfaceobserver.standalone.js"
			overwrite true
			retries 5
			connectTimeout 10000
			readTimeout 300000
		}
		copy {
			outputs.upToDateWhen { false }
			from "resources/common/normal/data"
			into "common/src/main/resources/data"
		}
		copy {
			outputs.upToDateWhen { false }
			from "resources/common/normal/assets/mtr/website"
			into "common/src/main/resources/assets/mtr/website"
		}
	}
	copy {
		outputs.upToDateWhen { false }
		from "resources/fabric/" + (rootProject.variation == "lifts" ? "lifts" : "normal")
		into "fabric/src/main/resources"
	}
	copy {
		outputs.upToDateWhen { false }
		from "resources/forge/" + (rootProject.variation == "lifts" ? "lifts" : "normal")
		into "forge/src/main/resources"
	}
	if (!rootProject.has_ante && rootProject.variation != "lifts") {
		copy {
			outputs.upToDateWhen { false }
			from "resources/fabric/no-ante"
			into "fabric/src/main/resources"
		}
		copy {
			outputs.upToDateWhen { false }
			from "resources/forge/no-ante"
			into "forge/src/main/resources"
		}
	}
	if (is_1_20) {
		fileTree("common/src/main/resources/data/mtr/loot_tables").include("**/*.json").each { file ->
			file.write(file.getText("UTF-8").replace("\"minecraft:alternative\"", "\"minecraft:any_of\""), "UTF-8")
		}
	}

	download {
		src "https://crowdin.com/backend/download/project/minecraft-transit-railway"
		dest "common/src/main/java/mtr/mappings/lang.zip"
		overwrite false
		retries 5
		connectTimeout 10000
		readTimeout 300000
	}
	copy {
		outputs.upToDateWhen { false }
		from(zipTree("common/src/main/java/mtr/mappings/lang.zip"))
		into "common/src/main/resources/assets/mtr/lang"
	}
	// Strings added by this project are kept outside the Crowdin pack and merged over it
	fileTree("common/src/main/lang").include("*.json").each { file ->
		def target = new File(rootDir, "common/src/main/resources/assets/mtr/lang/${file.name}")
		def text = target.getText("UTF-8")
		def lineBreak = System.lineSeparator()
		def lastEntryEnd = text.lastIndexOf('"') + 1
		def added = new JsonSlurper().parse(file, "UTF-8").findAll { key, value -> !text.contains("\"${key}\":") }.collect { key, value -> ",${lineBreak}	\"${key}\": \"${value}\"" }.join("")
		target.setText(text.substring(0, lastEntryEnd) + added + text.substring(lastEntryEnd), "UTF-8")
	}

	copy {
		outputs.upToDateWhen { false }
		from "common/src/main/KeysTemplate.java"
		into "common/src/main/java/mtr"
		filter(ReplaceTokens, tokens: ["key": patreon_api_key, "version": minecraft_version + "-" + rootProject.mod_version, "lifts": rootProject.variation, "server": testServer])
		rename "(.+)Template.java", "\$1.java"
	}
	copy {
		outputs.upToDateWhen { false }
		from "common/src/main/BuildConfigTemplate.java"
		into "common/src/main/java/cn/zbx1425/mtrsteamloco"
		filter(ReplaceTokens, tokens: ["version": rootProject.ante_version + "+" + minecraft_version, "protocol_version": rootProject.ante_protocol_version, "build_time": java.time.Instant.now().epochSecond.toString()])
		rename "(.+)Template.java", "\$1.java"
	}
	copy {
		outputs.upToDateWhen { false }
		from "common/src/main/latest.json"
		into "build/latest"
		filter(ReplaceTokens, tokens: ["version": rootProject.mod_version])
	}
	copy {
		outputs.upToDateWhen { false }
		from "common/src/main/version-template.js"
		into "common/src/main/resources/assets/mtr/website"
		filter(ReplaceTokens, tokens: ["version": minecraft_version + "-" + rootProject.mod_version])
		rename "(.+)-template.js", "\$1.js"
	}
	copy {
		outputs.upToDateWhen { false }
		from "fabric/src/main/UnknownPacketMixinTemplate.java"
		into "fabric/src/main/java/mtr/mixin"
		filter(ReplaceTokens, tokens: ["path1": minecraft_main_version <= 17 || minecraft_version == "1.18" ? "apache/logging/log4j" : "slf4j", "path2": minecraft_main_version <= 17 || minecraft_version == "1.18" ? "apache.logging.log4j" : "slf4j"])
		rename "(.+)Template.java", "\$1.java"
	}
	copy {
		outputs.upToDateWhen { false }
		from "forge/src/main/LevelRendererMixinTemplate.java"
		into "forge/src/main/java/mtr/mixin"
		filter(ReplaceTokens, tokens: ["path": is_1_19_4 || is_1_20 ? "org.joml" : "com.mojang.math"])
		rename "(.+)Template.java", "\$1.java"
	}

	if (minecraft_main_version <= 17) {
		copy {
			outputs.upToDateWhen { false }
			from "fabric/src/main/BlockEntityExtensionTemplate.java"
			into "fabric/src/main/java/" + (minecraft_main_version == 16 ? "me/shedaniel" : "dev") + "/architectury/extensions"
			filter(ReplaceTokens, tokens: ["package": minecraft_main_version == 16 ? "me.shedaniel" : "dev"])
			rename "(.+)Template.java", "\$1.java"
		}
	}
	if (minecraft_main_version != 16) {
		ant.delete(dir: "fabric/src/main/java/me")
	}
	if (minecraft_main_version != 17) {
		ant.delete(dir: "fabric/src/main/java/dev")
	}
}

allprojects {
	if (!isComponent(project)) {
		apply plugin: "architectury-plugin"
	}

	version = minecraft_version + "-" + rootProject.mod_version
	group = rootProject.maven_group

	repositories {
		maven { url = "https://jitpack.io/" }
		maven { url = "https://maven.terraformersmc.com/" }
		maven { url = "https://maven.parchmentmc.org/" }
		maven { url = "https://maven.shedaniel.me/" }
		mavenCentral()
		flatDir {
			dirs "../libs"
		}
	}

	tasks.withType(JavaCompile) {
		options.encoding = "UTF-8"

		// The component sets up its own Java version, so it builds the same on its own
		if (isComponent(project)) {
			return
		}

		if (minecraft_main_version == 16) {
			def targetVersion = 8
			if (JavaVersion.current().isJava9Compatible()) {
				options.release = targetVersion
			}
		} else if (minecraft_main_version == 17) {
			options.release = 16
		} else {
			options.release = 17
		}

		// ANTE switches between Minecraft versions with #if blocks
		if (rootProject.has_ante && name == "compileJava") {
			options.compilerArgs += ["-Xplugin:Manifold", "-AMC_VERSION=" + rootProject.minecraft_version_int]
		}
	}

	afterEvaluate {
		if (isComponent(it)) {
			return
		}
		for (def task in it.tasks) {
			if (task != rootProject.tasks.setupFiles) {
				task.dependsOn rootProject.tasks.setupFiles
			}
		}
	}
}

static String getModrinthMavenUrl(String projectId, String version) {
	return "https://api.modrinth.com/maven/maven/modrinth/${projectId}/${version}/${projectId}-${version}.jar"
}

static String[] getModrinthData(String loader, String minecraftVersion, String projectId) {
	def versionsArray = getJson("https://api.modrinth.com/v2/project/" + projectId + "/version")
	for (def versionElement : versionsArray) {
		if (versionElement["loaders"].contains(loader) && versionElement["game_versions"].contains(minecraftVersion)) {
			return [versionElement["version_number"], versionElement["files"][0]["url"]]
		}
	}
	return ["", ""]
}

static Object getJson(String url) {
	return readUrl(url) { inputStream -> new JsonSlurper().parse(inputStream, "UTF-8") }
}

static Object getXml(String url) {
	return readUrl(url) { inputStream -> new XmlSlurper().parse(inputStream) }
}

/**
 * Reads a URL a few times at most, each with timeouts, so a build without a network stops with an error instead of waiting
 * for ever.
 */
static Object readUrl(String url, Closure<Object> parse) {
	final int maxTries = 5
	Exception lastException = null
	for (int tries = 1; tries <= maxTries; tries++) {
		try {
			final URLConnection connection = new URL(url).openConnection()
			connection.connectTimeout = 10000
			connection.readTimeout = 60000
			final InputStream inputStream = connection.inputStream
			try {
				final Object result = parse(inputStream)
				if (tries > 1) {
					System.out.println("Parsed ${url} after ${tries} tries")
				}
				return result
			} finally {
				inputStream.close()
			}
		} catch (Exception e) {
			lastException = e
			Thread.sleep(1000L * tries)
		}
	}
	throw new GradleException("Couldn't read ${url} after ${maxTries} tries", lastException)
}
