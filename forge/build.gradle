import org.apache.tools.ant.filters.ReplaceTokens
import org.apache.tools.ant.taskdefs.condition.Os

loom {
	forge {
		mixinConfig "mtr.mixins.json"
	}
}

if (rootProject.has_ante) {
	loom {
		accessWidenerPath = project(":common").loom.accessWidenerPath

		forge {
			mixinConfig "mtrsteamloco.mixins.json"
			convertAccessWideners = true
			extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
		}
	}
} else {
	sourceSets.main.java.exclude "cn/**"
}

// The MTM_Logic entry in the mod list belongs to MTR, not to the lifts-only mod
if (rootProject.variation == "lifts") {
	sourceSets.main.java.exclude "mtr/mtm/**"
}

architectury {
	platformSetupLoomIde()
	forge()
}

configurations {
	common
	shadowCommon
	clothConfigJar
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentForge.extendsFrom common
}

dependencies {
	forge "net.minecraftforge:forge:${rootProject.forge_version}"
	modApi "${rootProject.architectury_id}:architectury-forge:${rootProject.architectury_data[0].split("\\+")[0]}"

	common(project(path: ":common", configuration: "namedElements")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
	implementation project(":transit-sim")
	shadowCommon(project(":transit-sim")) { transitive false }

	if (rootProject.has_ante) {
		modApi("me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}") { transitive false }
		modApi("me.shedaniel.cloth:basic-math:0.6.1") { transitive false }
		clothConfigJar("me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}") { transitive = false }
		clothConfigJar("me.shedaniel.cloth:basic-math:0.6.1") { transitive false }
	}
}

processResources {
	inputs.property "version", rootProject.mod_version
	inputs.property "mtm_version", rootProject.mtm_version

	// The version shown is MTR's own, which add-ons depend on; this fork's version is shown by MTM_Logic
	filesMatching("META-INF/mods.toml") {
		expand "version": rootProject.mod_version, "mtm_version": rootProject.mtm_version
	}
}

shadowJar {
	exclude "fabric.mod.json"
	exclude "*.bmp"
	exclude "module-info.class"
	exclude "META-INF/versions/*/module-info.class"
	exclude "**/*.kotlin_metadata"
	exclude "**/*.kotlin_module"
	exclude "**/*.kotlin_builtins"
	// The shadow plugin can't read classes for Java 21 and later. GraalJS falls back to its Java 17 classes without them.
	exclude "META-INF/versions/2?/**"

	zip64 true
	mergeServiceFiles()
	relocate "de.javagl", "vendor.cn.zbx1425.sowcerext.de.javagl"
	relocate "com.github.stuxuhai", "vendor.cn.zbx1425.mtrsteamloco.com.github.stuxuhai"
	relocate "me.shedaniel", "cn.zbx1425.mtrsteamloco.vendor.me.shedaniel"
	from project.configurations.clothConfigJar.files.collect {
		zipTree(it).matching { include "me/shedaniel/clothconfig2/**", "me/shedaniel/math/**", "assets/cloth-config2/**" }
	}

	configurations = [project.configurations.shadowCommon]
	classifier "dev-shadow"
	relocate "javax.servlet", "mtr.libraries.javax.servlet"
	relocate "org.eclipse", "mtr.libraries.org.eclipse"
	exclude "FileGenerator*.class", "ModUpload*.class", "UpdateSolder*.class"
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	classifier null

	// Loom writes Forge names only for mixins in this project, so the ANTE refmap from common still has Fabric names
	doLast {
		if (!rootProject.has_ante) {
			return
		}
		def tiny = net.fabricmc.loom.LoomGradleExtension.get(project).mappingsProvider.tinyMappingsWithSrg.toFile()
		def jarUri = URI.create("jar:" + archiveFile.get().asFile.toURI())
		def fileSystem = java.nio.file.FileSystems.newFileSystem(jarUri, [:])
		try {
			def refmap = fileSystem.getPath("mixins.mtrsteamloco.refmap.json")
			java.nio.file.Files.write(refmap, convertRefmapToSrg(new String(java.nio.file.Files.readAllBytes(refmap), "UTF-8"), tiny).getBytes("UTF-8"))
		} finally {
			fileSystem.close()
		}
	}
}

static String convertRefmapToSrg(String refmapText, File tinyFile) {
	def classes = [:]
	def members = [:]
	int fromColumn = -1
	int toColumn = -1
	tinyFile.eachLine("UTF-8") { line ->
		def parts = line.split("	", -1)
		if (parts[0] == "tiny") {
			fromColumn = parts.findIndexOf { it == "intermediary" } - 3
			toColumn = parts.findIndexOf { it == "srg" } - 3
		} else if (parts[0] == "c") {
			classes[parts[1 + fromColumn]] = parts[1 + toColumn]
		} else if (parts.length > 3 && parts[0] == "" && (parts[1] == "m" || parts[1] == "f")) {
			members[parts[3 + fromColumn]] = parts[3 + toColumn]
		}
	}

	def convert = { String value ->
		value.replaceAll('net/minecraft/class_\\d+(\\$class_\\d+)*') { match -> classes[match[0]] ?: match[0] }.replaceAll('\\b(method|field|comp)_\\d+') { match -> members[match[0]] ?: match[0] }
	}

	def refmap = new groovy.json.JsonSlurper().parseText(refmapText)
	def converted = refmap.mappings.collectEntries { mixin, entries -> [mixin, entries.collectEntries { key, value -> [key, convert(value)] }] }
	return groovy.json.JsonOutput.toJson([mappings: converted, data: [searge: converted]])
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

task serverMixinConfig {
	def source = file("../resources/common/ante/mtrsteamloco.mixins.json")
	def target = file("build/serverJar/mtrsteamloco.mixins.json")
	inputs.file source
	outputs.file target
	onlyIf { rootProject.has_ante }
	doLast {
		rootProject.writeServerMixinConfig(source, target)
	}
}

task serverJar(type: Zip) {
	dependsOn remapJar, serverMixinConfig
	from(zipTree(remapJar.archiveFile)) {
		exclude rootProject.server_jar_excludes
	}
	if (rootProject.has_ante) {
		from "build/serverJar"
	}
	archiveFileName = remapJar.archiveFileName.map { it.replace(".jar", "-server.jar") }
	destinationDirectory = file("build/libs")
	zip64 true
}

build.dependsOn serverJar

// The logic and the assets as two mods (2026-11-09): the logic jar is the build without the assets, which only clients use
// and which change seldom; MTM_Assets is the assets alone, with its own version
task assetsJar(type: Zip) {
	dependsOn remapJar
	inputs.property "mtm_assets_version", rootProject.mtm_assets_version
	from(zipTree(remapJar.archiveFile)) {
		include rootProject.assets_jar_includes
	}
	from(zipTree(remapJar.archiveFile)) {
		include "mtm/assets/**"
	}
	from("../resources/forge/mtm_assets") {
		filesMatching("META-INF/mods.toml") {
			expand "version": rootProject.mtm_assets_version
		}
	}
	archiveFileName = remapJar.archiveFileName.map { it.replace(".jar", "-assets.jar") }
	destinationDirectory = file("build/libs")
	zip64 true
}

task logicJar(type: Zip) {
	dependsOn remapJar
	from(zipTree(remapJar.archiveFile)) {
		exclude rootProject.assets_jar_includes
		// The assets mod's own class goes in its jar
		exclude "mtm/assets/**"
	}
	archiveFileName = remapJar.archiveFileName.map { it.replace(".jar", "-logic.jar") }
	destinationDirectory = file("build/libs")
	zip64 true
}

build.dependsOn assetsJar, logicJar

task moveForgeBuilds() {
	doLast {
		delete fileTree("../build/release").matching {
			include "**/${rootProject.variation_header}-forge*", "**/MTR3-MTM-*-forge-*"
		}
		delete fileTree("../build/libs").matching {
			include "**/${rootProject.variation_header}-forge*"
		}
		delete fileTree("../build/latest").matching {
			include "**/${rootProject.variation_header}-forge*"
		}
		copy {
			from "build/libs"
			if (rootProject.variation == "normal") {
				// MTR3-MTM-<this fork's version>-forge-<Minecraft version>.jar is the logic without the assets, and
				// MTR3-MTM-Assets-<assets version>-forge-<Minecraft version>.jar the assets alone (2026-11-09)
				include "*${rootProject.mod_version}-logic.jar", "*${rootProject.mod_version}-server.jar", "*${rootProject.mod_version}-assets.jar"
				rename { fileName -> fileName.endsWith("-assets.jar") ? "MTR3-MTM-Assets-${rootProject.mtm_assets_version}-forge-${rootProject.minecraft_version}.jar" : "MTR3-MTM-${rootProject.mtm_version}-forge-${rootProject.minecraft_version}" + (fileName.endsWith("-server.jar") ? "-server.jar" : ".jar") }
			} else {
				include "*${rootProject.mod_version}.jar", "*${rootProject.mod_version}-server.jar"
			}
			into "../build/release"
			if (rootProject.variation != "normal") {
				rename "(.+)", "${rootProject.variation_header}-\$1"
			}
		}
		if (rootProject.variation == "normal") {
			copy {
				from "build/libs"
				into "../build/latest"
				rename { fileName -> "MTR-${fileName.replace(rootProject.mod_version, "latest")}" }
			}
			copy {
				from "build/libs"
				include "*${rootProject.mod_version}-dev-shadow.jar"
				into "../build/libs"
				rename "(.+)", "MTR-\$1"
			}
		}
	}
}

task testServer {
	doLast {
		if (rootProject.variation == "normal") {
			copy {
				from "../resources/eula.txt"
				into "server"
			}
			copy {
				from "../resources/server.properties"
				into "server"
				filter(ReplaceTokens, tokens: ["port": String.valueOf(25500 + new Random().nextInt(500))])
			}
			copy {
				from "../build/latest"
				into "server/mods"
				include "MTR-forge-*-latest.jar"
				rename "(.+)", "MTR.jar"
			}
			download {
				src rootProject.architectury_data[1]
				dest "forge/server/mods/architectury.jar"
				overwrite true
				retries 5
				connectTimeout 10000
				readTimeout 300000
			}
			download {
				src "https://maven.minecraftforge.net/net/minecraftforge/forge/${rootProject.forge_version}/forge-${rootProject.forge_version}-installer.jar"
				dest "forge/server/forge-installer.jar"
				overwrite true
				retries 5
				connectTimeout 10000
				readTimeout 300000
			}
			javaexec {
				mainClass = "-jar"
				args = ["forge-installer.jar", "--installServer"]
				workingDir = "server"
			}
			if (!rootProject.forge_version.startsWith("1.16.5")) {
				javaexec {
					mainClass = "@libraries/net/minecraftforge/forge/${rootProject.forge_version}/${Os.isFamily(Os.FAMILY_WINDOWS) ? "win" : "unix"}_args.txt"
					args = ["nogui"]
					jvmArgs = ["-Xms4G", "-Xmx4G"]
					workingDir = "server"
				}
			}
		}
	}
}

afterEvaluate {
	for (def task in it.tasks) {
		if (task == tasks.build) {
			task.finalizedBy tasks.moveForgeBuilds
		}
	}
}
