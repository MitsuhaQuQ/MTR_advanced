name: Build
# ante-merge is pushed as both itself and main, the same commit: built once, on main. Changes to the docs only aren't built.
on:
  pull_request:
    paths-ignore: [ '**.md' ]
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Only 1.20.1 is built for now (user 2026-11-08); the others are put back when they are worked on again:
        # [ 1.16.5, 1.17.1, 1.18.2, 1.19.4, 1.20.1 ]
        minecraft: [ 1.20.1 ]
        # Only the normal jars: the server and lifts variations leave the merged ANTE code out, which this fork's MTR code
        # needs, so they can't be built (2026-11-14)
        variation: [ normal ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
      - name: Validate gradle wrapper
        uses: gradle/wrapper-validation-action@main
      - name: Setup JDK 17
        uses: actions/setup-java@main
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build ${{ matrix.minecraft }}
        run: ./gradlew build -PbuildVersion="${{ matrix.minecraft }}" -PpatreonApiKey="${{ secrets.PATREON_API_KEY }}" -Pvariation="${{ matrix.variation }}" --continue
      - name: Capture release artifacts
        uses: actions/upload-artifact@main
        with:
          name: Fabric and Forge ${{ matrix.variation }}
          path: build/release/
      - name: Capture lib artifacts
        if: ${{ matrix.variation == 'normal' || matrix.variation == 'server' }}
        uses: actions/upload-artifact@main
        with:
          name: Libraries
          path: build/libs/
      - name: Upload files to SFTP
        env:
          MY_KEY: ${{ secrets.FTP_HOST }}
        if: ${{ env.MY_KEY != '' }}
        uses: sand4rt/ftp-deployer@master
        with:
          sftp: true
          host: ${{ secrets.FTP_HOST }}
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          remote_folder: ${{ secrets.FTP_PATH }}
          local_folder: build/latest
          exclude: '["latest.json"]'
      - name: Upload version file to SFTP
        env:
          MY_KEY: ${{ secrets.FTP_HOST }}
        if: ${{ env.MY_KEY != '' && matrix.minecraft == '1.16.5' }}
        uses: sand4rt/ftp-deployer@master
        with:
          sftp: true
          host: ${{ secrets.FTP_HOST }}
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          remote_folder: ${{ secrets.FTP_PATH }}
          local_folder: build/latest
          include: '["latest.json"]'
  # The server test job of upstream MTR is left out (2026-11-14): it never got to run here, as it waited on the variations
  # above, and starts its server the upstream way; the servers are tested locally instead (C:/gtmp/fast/round.sh)
  crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
      - name: Upload Translations to Crowdin
        env:
          MY_KEY: ${{ secrets.CROWDIN_API_KEY }}
        if: ${{ env.MY_KEY != '' && github.ref == 'refs/heads/master' }}
        uses: crowdin/github-action@master
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          push_translations: false
          create_pull_request: false
          project_id: '455212'
          token: ${{ secrets.CROWDIN_API_KEY }}
          config: 'crowdin.yml'
