<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title data-i18n="MTR 高级编辑器">MTR 高级编辑器</title>
	<link rel="stylesheet" href="editor.css">
</head>
<body>
<header class="top">
	<button class="tree-toggle" id="btn-tree" aria-controls="tree" aria-expanded="true" title="显示或收起左栏" data-i18n-title="显示或收起左栏">☰</button>
	<h1 data-i18n="MTR 高级编辑器">MTR 高级编辑器</h1>
	<nav class="ws-tabs" role="tablist" aria-label="工作区" data-i18n-aria-label="工作区">
		<a href="#/timetable" class="ws-tab" role="tab" data-ws-tab="timetable" aria-selected="true"><span data-i18n="运行编辑">运行编辑</span><span class="ws-dot" id="ws-draft-dot" title="有还没应用的草稿" data-i18n-title="有还没应用的草稿" hidden></span></a>
		<a href="#/media/audio" class="ws-tab" role="tab" data-ws-tab="media" data-ws-part="audio" aria-selected="false" title="上传和管理报站音频等媒体文件" data-i18n-title="上传和管理报站音频等媒体文件" data-i18n="媒体库">媒体库</a>
	</nav>
	<a class="try-next" href="next/#/timetable" title="新版编辑器正在逐层搬过来；草稿两边共用" data-i18n-title="新版编辑器正在逐层搬过来；草稿两边共用" data-i18n="试用新版">试用新版</a>
	<span class="spacer"></span>
	<span class="tag" id="draft-tag" data-ws="timetable" data-i18n="没有草稿">没有草稿</span>
	<span class="usage" id="media-usage" data-ws="media"><span class="meter"><i id="media-meter"></i></span><span id="media-usage-text"></span></span>
	<input type="file" id="media-file" multiple hidden>
	<button id="media-upload" class="primary" data-ws="media" disabled data-i18n="上传音频">上传音频</button>
	<label class="day" data-ws="timetable"><span data-i18n="运行日">运行日</span>
		<select id="day">
			<option value="0" data-i18n="周一">周一</option>
			<option value="1" data-i18n="周二">周二</option>
			<option value="2" data-i18n="周三">周三</option>
			<option value="3" data-i18n="周四">周四</option>
			<option value="4" data-i18n="周五">周五</option>
			<option value="5" data-i18n="周六">周六</option>
			<option value="6" data-i18n="周日">周日</option>
		</select>
	</label>
	<button id="btn-new" data-ws="timetable" aria-haspopup="menu" data-i18n="新建 ▾">新建 ▾</button>
	<button id="btn-delete" data-ws="timetable" disabled title="先选中一个种别" data-i18n-title="先选中一个种别" data-i18n="删除种别">删除种别</button>
	<button id="btn-sync" data-ws="timetable" title="页面和游戏哪里不一致、游戏哪里没做成" data-i18n-title="页面和游戏哪里不一致、游戏哪里没做成">同步状态</button>
	<button id="btn-apply" data-ws="timetable" class="primary" disabled title="把草稿发给游戏" data-i18n-title="把草稿发给游戏" data-i18n="应用">应用</button>
</header>

<div class="app" data-ws="timetable">
	<nav class="tree" id="tree" aria-label="线路和车厂" data-i18n-aria-label="线路和车厂"></nav>
	<div class="scrim" id="scrim"></div>
	<main>
		<div class="tabs" role="tablist">
			<button class="tab" id="tab-table" role="tab" aria-selected="false" data-i18n="汇总时刻表">汇总时刻表</button>
			<button class="tab" id="tab-diagram" role="tab" aria-selected="true" data-i18n="运行图">运行图</button>
			<button class="tab" id="tab-network" role="tab" aria-selected="false" data-i18n="全网配线">全网配线</button>
			<button id="btn-split" aria-pressed="false" title="运行图在上，时刻表在下" data-i18n-title="运行图在上，时刻表在下" data-i18n="上下显示" hidden>上下显示</button>
			<span class="crumb" id="crumb"></span>
			<span class="tools">
				<span class="sim-status" id="sim-status"></span>
				<button id="btn-sim-now" hidden aria-pressed="false" title="今天从游戏里列车现在的位置接着模拟，而不是从运营日开始时全部从车厂出发" data-i18n-title="今天从游戏里列车现在的位置接着模拟，而不是从运营日开始时全部从车厂出发" data-i18n="从现在开始">从现在开始</button>
				<button id="btn-resimulate" hidden title="重新模拟" data-i18n-title="重新模拟">↻</button>
				<button id="btn-simulate" hidden aria-pressed="false" title="按草稿模拟一天，在运行图上叠加实际运行线" data-i18n-title="按草稿模拟一天，在运行图上叠加实际运行线" data-i18n="模拟运行">模拟运行</button>
				<label class="check" title="在运行图上显示车厂行和出入库回送" data-i18n-title="在运行图上显示车厂行和出入库回送"><input type="checkbox" id="chk-depots" checked> <span data-i18n="显示车厂">显示车厂</span></label>
				<label class="check" title="同一段轨道上别的线路的班次，画成细虚线，只读；在它自己的线路里改" data-i18n-title="同一段轨道上别的线路的班次，画成细虚线，只读；在它自己的线路里改"><input type="checkbox" id="chk-access" checked> <span data-i18n="显示接入">显示接入</span></label>
				<button id="btn-no-train" aria-pressed="false" title="把没有车跑的班次标成红色，有车的变淡" data-i18n-title="把没有车跑的班次标成红色，有车的变淡" data-i18n="没车的班次">没车的班次</button>
				<button id="btn-zoom-out" title="缩小时间轴" data-i18n-title="缩小时间轴">−</button>
				<button id="btn-zoom-in" title="放大时间轴" data-i18n-title="放大时间轴">＋</button>
			</span>
		</div>
		<div class="banner" id="banner" hidden></div>
		<section class="view diagram" id="view-diagram">
			<div class="canvas-wrap" id="canvas-wrap"><canvas id="canvas" aria-label="运行图" data-i18n-aria-label="运行图"></canvas></div>
			<aside class="inspector" id="inspector"></aside>
		</section>
		<section class="view table-view" id="view-table" hidden></section>
		<section class="view network-view" id="view-network" hidden>
			<div class="net-tools">
				<select id="net-mode" aria-label="运输方式" data-i18n-aria-label="运输方式"></select>
				<select id="net-layer" aria-label="图层" data-i18n-aria-label="图层" title="物理线路：轨道、寻路边界、留置位；区段归属：每段轨道归哪些线路，联络线也在这一层" data-i18n-title="物理线路：轨道、寻路边界、留置位；区段归属：每段轨道归哪些线路，联络线也在这一层"></select>
				<button id="net-fit" data-i18n="全图">全图</button>
				<button id="net-zoom-out" title="缩小" data-i18n-title="缩小">−</button>
				<button id="net-zoom-in" title="放大" data-i18n-title="放大">＋</button>
				<button id="net-refresh" title="向游戏要最新的轨道" data-i18n-title="向游戏要最新的轨道">↻</button>
				<button id="net-console-toggle" title="看各信号区段的占用和列车，扣停、折返、清客、回库" data-i18n-title="看各信号区段的占用和列车，扣停、折返、清客、回库" data-i18n="调度台">调度台</button>
				<span class="hint" id="net-info" title="放大后按实际走向画，缩小时画成示意图（只有横、竖和 45°）" data-i18n-title="放大后按实际走向画，缩小时画成示意图（只有横、竖和 45°）"></span>
				<span class="hint net-legend" id="net-legend" data-i18n="紫：寻路边界　橙虚线：联络线独占　灰虚线：已放行　粗线：站台　黄：存车线　棕：留置位">紫：寻路边界　橙虚线：联络线独占　灰虚线：已放行　粗线：站台　黄：存车线　棕：留置位</span>
			</div>
			<div class="net-wrap" id="net-wrap"><canvas id="net-canvas" aria-label="全网配线" data-i18n-aria-label="全网配线"></canvas><aside class="net-console" id="net-console" hidden></aside><aside class="net-waypick" id="net-waypick" hidden></aside></div>
		</section>
	</main>
</div>

<!-- The media library (media.js): kinds on the left, the files of one kind, and the file picked -->
<div class="media-app" id="media-app" data-ws="media">
	<nav class="media-side" id="media-side" aria-label="媒体类别" data-i18n-aria-label="媒体类别">
		<div class="section" data-i18n="媒体">媒体</div>
		<div id="media-kinds" role="list"></div>
		<div class="section" id="media-requests-head" data-i18n="上传与消息" hidden>上传与消息</div>
		<ul class="media-requests" id="media-requests"></ul>
	</nav>
	<div class="scrim" id="media-scrim"></div>
	<main class="media-main">
		<div class="banner warn" id="media-banner" hidden></div>
		<div class="media-tools">
			<input type="search" id="media-search" placeholder="搜索名称或声音 ID" data-i18n-placeholder="搜索名称或声音 ID" aria-label="搜索" data-i18n-aria-label="搜索">
			<select id="media-uploader" aria-label="上传者" data-i18n-aria-label="上传者"></select>
			<button id="media-missing" aria-pressed="false" title="只列出这台电脑还没有下载的文件" data-i18n-title="只列出这台电脑还没有下载的文件" data-i18n="只看本机没有">只看本机没有</button>
		</div>
		<p class="hint media-limits" id="media-limits"></p>
		<div class="media-list" id="media-list">
			<table class="audio-list">
				<thead>
				<tr><th data-i18n="名称">名称</th><th data-i18n="时长">时长</th><th data-i18n="大小">大小</th><th class="uploader" data-i18n="上传者">上传者</th><th data-i18n="本机">本机</th><th></th></tr>
				</thead>
				<tbody id="media-entries"></tbody>
			</table>
			<p class="hint media-empty" id="media-empty" hidden></p>
			<div class="media-drop" id="media-drop" hidden></div>
		</div>
	</main>
	<aside class="inspector media-detail" id="media-detail"></aside>
</div>

<footer class="status" id="status" data-ws="timetable"></footer>
<footer class="status" id="media-status" data-ws="media"></footer>
<audio id="media-player" hidden></audio>
<div class="tooltip" id="tooltip" hidden></div>
<dialog id="dialog"></dialog>
<script src="i18n.js"></script>
<script src="shell.js"></script>
<script src="batch.js"></script>
<script src="terminal.js"></script>
<script src="editor.js"></script>
</body>
</html>
