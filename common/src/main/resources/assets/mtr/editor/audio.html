<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MTR</title>
	<!-- The announcement audio page is now the editor's media library; an old link or bookmark opens it there, the key kept -->
	<script>
		(() => {
			const match = location.hash.match(/key=([0-9a-f]+)/);
			try {
				if (match) sessionStorage.setItem("mtr-editor-key", match[1]);
			} catch (e) {
				// Passed on in the address below instead
			}
			location.replace("index.html#/media/audio" + (match ? "&key=" + match[1] : ""));
		})();
	</script>
</head>
<body>
<p><a href="index.html#/media/audio">→ index.html#/media/audio</a></p>
</body>
</html>
