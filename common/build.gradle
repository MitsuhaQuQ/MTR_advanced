if (rootProject.has_ante) {
	apply from: "../process_access_widener.gradle"

	loom {
		mixin {
			defaultRefmapName = "mixins.mtrsteamloco.refmap.json"
		}
		accessWidenerPath = processAccessWidener(file("./src/main/mtrsteamloco.accesswidener"), file("./src/main/resources/mtrsteamloco_filtered.accesswidener"))
	}
} else {
	sourceSets.main.java.exclude "cn/**", "de/**"
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version[1]}"
	modApi "${rootProject.architectury_id}:architectury:${rootProject.architectury_data[0].split("\\+")[0]}"
	if (rootProject.has_ante) {
		modApi("me.shedaniel.cloth:cloth-config:${rootProject.cloth_config_version}") { transitive = false }
	}
	api project(":transit-sim")
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
		showStandardStreams = true
	}
}

architectury {
	common("fabric", "forge")
}

// Default package tools crash the Architectury runtime transformer, which expects every class to be in a package
jar {
	exclude "FileGenerator*.class", "ModUpload*.class", "UpdateSolder*.class"
}

// The legacy_unicode font provider was removed in 1.20
processResources {
	if (rootProject.is_1_20) {
		filesMatching("assets/mtr/font/mtr.json") {
			filter { line ->
				if (line.contains("\"template\"")) {
					return null
				}
				return line.replace("\"legacy_unicode\"", "\"reference\"").replaceAll("\"sizes\".*", "\"id\": \"minecraft:include/unifont\"")
			}
		}
	}
}

// Fabric and Forge use the dev jar, and Loom can't read the Java 21 classes in the GraalJS jars on this classpath
remapJar {
	enabled = false
}

task moveCommonBuilds() {
	doLast {
		delete fileTree("../build/libs").matching {
			include "**/MTR-common*"
		}
		delete fileTree("../build/latest").matching {
			include "**/MTR-common*"
		}
		if (rootProject.variation == "server") {
			copy {
				from "build/devlibs"
				include "*dev.jar"
				into "../build/libs"
				rename "(.+)", "MTR-\$1"
			}
			copy {
				from "build/devlibs"
				include "*dev.jar"
				into "../build/latest"
				rename { fileName -> "MTR-${fileName.replace(rootProject.mod_version, "latest")}" }
			}
		}
	}
}

afterEvaluate {
	for (def task in it.tasks) {
		if (task == tasks.build) {
			task.finalizedBy tasks.moveCommonBuilds
		}
	}
}

// The production transforms read the component from its jar, so it has to be built first
tasks.matching { it.name.startsWith("transformProduction") }.configureEach {
	dependsOn ":transit-sim:jar"
}
