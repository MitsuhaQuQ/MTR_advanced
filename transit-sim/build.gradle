// Runs timetables, vehicle workings and the rail network without Minecraft, so it can be used by other hosts too.
// It must not depend on Minecraft, netty or anything else of the mod.
// It builds the same as part of the mod and on its own, offline once its dependencies are cached:
//   ./gradlew -p transit-sim test --offline
apply plugin: "java-library"

repositories {
	mavenCentral()
}

dependencies {
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

// Java 8, so every Minecraft version can use it
tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
	options.release = 8
}

test {
	useJUnitPlatform()
	// -Dbenchmark=true runs the benchmarks too
	systemProperty "benchmark", System.getProperty("benchmark", "false")
	testLogging {
		events "failed"
		exceptionFormat "full"
		showStandardStreams = true
	}
}

// The day tool reads a world's database, so it has a source set of its own: nothing of it, nor SQLite, goes into the
// component's jar or the mod. It is only built when it is run:
//   ./gradlew -p transit-sim simulateDay --args="path/to/mtr.db [yyyy-mm-dd] [time zone] [day start hour] [--events]"
sourceSets {
	tools {
		java.srcDir "src/tools/java"
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

dependencies {
	toolsImplementation "org.xerial:sqlite-jdbc:3.46.1.3"
}

// Splits every depot's duties of a world into duty layers and back (duty groups, step 1):
//   ./gradlew -p transit-sim checkDutyLayers --args="path/to/mtr.db"
tasks.register("checkDutyLayers", JavaExec) {
	classpath = sourceSets.tools.runtimeClasspath
	mainClass = "transitsim.tools.CheckDutyLayers"
}

tasks.register("simulateDay", JavaExec) {
	classpath = sourceSets.tools.runtimeClasspath
	mainClass = "transitsim.tools.SimulateDay"
	// -Pmtr.throatLocks=false runs the day without trains locking station throats, to compare
	systemProperty "mtr.throatLocks", project.findProperty("mtr.throatLocks") ?: "true"
	systemProperty "mtr.simHours", project.findProperty("mtr.simHours") ?: "24"
	// -Pmtr.simRoutes=id,id simulates only those routes' part of the world; -Pmtr.simRoutes=scopes lists its sizes
	systemProperty "mtr.simRoutes", project.findProperty("mtr.simRoutes") ?: ""
	// -Pmtr.noLinePools=true runs without trains going back to other depots of their line
	systemProperty "mtr.noLinePools", project.findProperty("mtr.noLinePools") ?: "false"
	// -Pmtr.earlyThreshold=millis runs the day with another early threshold than the world's, to compare
	systemProperty "mtr.earlyThreshold", project.findProperty("mtr.earlyThreshold") ?: ""
	// -Pmtr.blockMinLength=100000 runs without long track cut into block sections, to compare; -Pmtr.debugStuck=true lists
	// the trains standing between stations at the end and what holds them up
	systemProperty "mtr.blockMinLength", project.findProperty("mtr.blockMinLength") ?: "400"
	systemProperty "mtr.debugStuck", project.findProperty("mtr.debugStuck") ?: "false"
	// -Pmtr.runLayer=false runs the day by the rules taken over from MTR instead of the run layer, to compare
	systemProperty "mtr.runLayer", project.findProperty("mtr.runLayer") ?: "true"
	// -Pmtr.runningSides=false runs the day booking double track as single track, as before 0.69.0, to compare
	systemProperty "mtr.runningSides", project.findProperty("mtr.runningSides") ?: "true"
	// -Pmtr.trainMargin=false runs the day with trains keeping no room to each other, as before, to compare
	systemProperty "mtr.trainMargin", project.findProperty("mtr.trainMargin") ?: "true"
}
