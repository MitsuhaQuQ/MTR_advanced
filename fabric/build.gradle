import org.apache.tools.ant.filters.ReplaceTokens

if (rootProject.has_ante) {
	loom {
		accessWidenerPath = project(":common").loom.accessWidenerPath
	}
} else {
	sourceSets.main.java.exclude "cn/**"
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common
	shadowCommon
	clothConfigJar
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version[1]}"
	modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_data[0]}"
	modApi "com.terraformersmc:modmenu:${rootProject.mod_menu_data[0]}"

	common(project(path: ":common", configuration: "namedElements")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
	implementation project(":transit-sim")
	shadowCommon(project(":transit-sim")) { transitive false }

	if (rootProject.has_ante) {
		modApi("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") { transitive false }
		modApi("me.shedaniel.cloth:basic-math:0.6.1") { transitive false }
		clothConfigJar("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") { transitive false }
		clothConfigJar("me.shedaniel.cloth:basic-math:0.6.1") { transitive false }
	}
}

// A mod of its own nested in the jar, so the mod list shows this fork's version as MTM_Logic beside MTR's
task mtmLogicJar(type: Jar) {
	inputs.property "mtm_version", rootProject.mtm_version
	archiveFileName = "mtm_logic.jar"
	destinationDirectory = file("build/mtmLogic")
	from("../resources/fabric/mtm_logic") {
		// Only the metadata is filled in; the icon is a picture and must be copied as it is
		filesMatching("fabric.mod.json") {
			expand "version": rootProject.mtm_version
		}
	}
}

processResources {
	inputs.property "version", rootProject.mod_version

	// The version shown is MTR's own, which add-ons depend on; this fork's version is shown by MTM_Logic
	filesMatching("fabric.mod.json") {
		expand "version": rootProject.mod_version
	}
}

shadowJar {
	exclude "*.bmp"
	exclude "**/*.kotlin_metadata"
	exclude "**/*.kotlin_module"
	exclude "**/*.kotlin_builtins"
	// The shadow plugin can't read classes for Java 21 and later. GraalJS falls back to its Java 17 classes without them.
	exclude "META-INF/versions/2?/**"

	zip64 true
	mergeServiceFiles()
	relocate "de.javagl", "vendor.cn.zbx1425.sowcerext.de.javagl"
	relocate "com.github.stuxuhai", "vendor.cn.zbx1425.mtrsteamloco.com.github.stuxuhai"
	relocate "me.shedaniel", "cn.zbx1425.mtrsteamloco.vendor.me.shedaniel"
	from project.configurations.clothConfigJar.files.collect {
		zipTree(it).matching { include "me/shedaniel/clothconfig2/**", "me/shedaniel/math/**", "assets/cloth-config2/**" }
	}

	configurations = [project.configurations.shadowCommon]
	classifier "dev-shadow"
	relocate "javax.servlet", "mtr.libraries.javax.servlet"
	relocate "org.eclipse", "mtr.libraries.org.eclipse"
	exclude "FileGenerator*.class", "ModUpload*.class", "UpdateSolder*.class"
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	classifier null
	// Nested here rather than in the resources, as the shadow plugin unpacks jars it copies; Loom also lists it in fabric.mod.json
	if (rootProject.variation != "lifts") {
		nestedJars.from(mtmLogicJar)
	}
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

task serverMixinConfig {
	def source = file("../resources/common/ante/mtrsteamloco.mixins.json")
	def target = file("build/serverJar/mtrsteamloco.mixins.json")
	inputs.file source
	outputs.file target
	onlyIf { rootProject.has_ante }
	doLast {
		rootProject.writeServerMixinConfig(source, target)
	}
}

task serverJar(type: Zip) {
	dependsOn remapJar, serverMixinConfig
	from(zipTree(remapJar.archiveFile)) {
		exclude rootProject.server_jar_excludes
	}
	if (rootProject.has_ante) {
		from "build/serverJar"
	}
	archiveFileName = remapJar.archiveFileName.map { it.replace(".jar", "-server.jar") }
	destinationDirectory = file("build/libs")
	zip64 true
}

build.dependsOn serverJar

// The logic and the assets as two mods (2026-11-09): the logic jar is the build without the assets, which only clients use
// and which change seldom; MTM_Assets is the assets alone, with its own version
task assetsJar(type: Zip) {
	dependsOn remapJar
	inputs.property "mtm_assets_version", rootProject.mtm_assets_version
	from(zipTree(remapJar.archiveFile)) {
		include rootProject.assets_jar_includes
	}
	from("../resources/fabric/mtm_assets") {
		filesMatching("fabric.mod.json") {
			expand "version": rootProject.mtm_assets_version
		}
	}
	archiveFileName = remapJar.archiveFileName.map { it.replace(".jar", "-assets.jar") }
	destinationDirectory = file("build/libs")
	zip64 true
}

task logicJar(type: Zip) {
	dependsOn remapJar
	from(zipTree(remapJar.archiveFile)) {
		// The assets stay in this jar unless they go in their own mod (split_assets)
		if (rootProject.split_assets == "true") {
			exclude rootProject.assets_jar_includes
		}
	}
	archiveFileName = remapJar.archiveFileName.map { it.replace(".jar", "-logic.jar") }
	destinationDirectory = file("build/libs")
	zip64 true
}

build.dependsOn logicJar
if (rootProject.split_assets == "true") {
	build.dependsOn assetsJar
}

task moveFabricBuilds() {
	doLast {
		delete fileTree("../build/release").matching {
			include "**/${rootProject.variation_header}-fabric*", "**/MTR3-MTM-*-fabric-*"
		}
		delete fileTree("../build/libs").matching {
			include "**/${rootProject.variation_header}-fabric*"
		}
		delete fileTree("../build/latest").matching {
			include "**/${rootProject.variation_header}-fabric*"
		}
		copy {
			from "build/libs"
			if (rootProject.variation == "normal") {
				// MTR3-MTM-<this fork's version>-fabric-<Minecraft version>.jar is the logic without the assets, and
				// MTR3-MTM-Assets-<assets version>-fabric-<Minecraft version>.jar the assets alone (2026-11-09)
				include "*${rootProject.mod_version}-logic.jar", "*${rootProject.mod_version}-server.jar"
				if (rootProject.split_assets == "true") {
					include "*${rootProject.mod_version}-assets.jar"
				}
				rename { fileName -> fileName.endsWith("-assets.jar") ? "MTR3-MTM-Assets-${rootProject.mtm_assets_version}-fabric-${rootProject.minecraft_version}.jar" : "MTR3-MTM-${rootProject.mtm_version}-fabric-${rootProject.minecraft_version}" + (fileName.endsWith("-server.jar") ? "-server.jar" : ".jar") }
			} else {
				include "*${rootProject.mod_version}.jar", "*${rootProject.mod_version}-server.jar"
			}
			into "../build/release"
			if (rootProject.variation != "normal") {
				rename "(.+)", "${rootProject.variation_header}-\$1"
			}
		}
		if (rootProject.variation == "normal") {
			copy {
				from "build/libs"
				into "../build/latest"
				rename { fileName -> "MTR-${fileName.replace(rootProject.mod_version, "latest")}" }
			}
			copy {
				from "build/libs"
				include "*${rootProject.mod_version}-dev-shadow.jar"
				into "../build/libs"
				rename "(.+)", "MTR-\$1"
			}
		}
	}
}

task testServer {
	doLast {
		if (rootProject.variation == "normal") {
			copy {
				from "../resources/eula.txt"
				into "server"
			}
			copy {
				from "../resources/server.properties"
				into "server"
				filter(ReplaceTokens, tokens: ["port": String.valueOf(25000 + new Random().nextInt(500))])
			}
			copy {
				from "../build/latest"
				into "server/mods"
				include "MTR-fabric-*-latest.jar"
				rename "(.+)", "MTR.jar"
			}
			download {
				src rootProject.fabric_api_data[1]
				dest "fabric/server/mods/fabric-api.jar"
				overwrite true
				retries 5
				connectTimeout 10000
				readTimeout 300000
			}
			if (!rootProject.architectury_fabric_url.isEmpty()) {
				download {
					src rootProject.architectury_fabric_url
					dest "fabric/server/mods/architectury.jar"
					overwrite true
					retries 5
					connectTimeout 10000
					readTimeout 300000
				}
			}
			download {
				src "https://meta.fabricmc.net/v2/versions/loader/${rootProject.fabric_loader_version[0]}/${rootProject.fabric_loader_version[1]}/0.11.1/server/jar"
				dest "fabric/server/fabric-server.jar"
				overwrite true
				retries 5
				connectTimeout 10000
				readTimeout 300000
			}
			javaexec {
				mainClass = "-jar"
				args = ["fabric-server.jar", "nogui"]
				jvmArgs = ["-Xms4G", "-Xmx4G"]
				workingDir = "server"
			}
		}
	}
}

afterEvaluate {
	for (def task in it.tasks) {
		if (task == tasks.build) {
			task.finalizedBy tasks.moveFabricBuilds
		}
	}
}
